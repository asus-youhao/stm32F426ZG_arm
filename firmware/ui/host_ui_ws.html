<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<title>上位機（連線版）— Python 假硬體</title>
<style>
 :root{--bg:#0d1117;--panel:#161b22;--line:#283040;--txt:#e6edf3;--mut:#8b97a6;
       --accent:#4fd1c5;--good:#48bb78;--warn:#f56565;--tx:#f6ad55;--rx:#63b3ed;}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);
   font-family:"Consolas","PingFang TC",monospace;font-size:13px}
 header{padding:9px 14px;background:linear-gradient(135deg,#10303a,#161b22);border-bottom:1px solid var(--line);
        display:flex;gap:10px;align-items:center}
 header h1{font-size:1rem;margin:0;margin-right:auto}
 #conn{padding:3px 10px;border-radius:12px;background:#4a1818;color:var(--warn);font-weight:700}
 #conn.ok{background:#1c4532;color:var(--good)}
 button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#1f2733;color:var(--txt);cursor:pointer}
 button:hover{border-color:var(--accent)} button.estop{background:#c53030;border-color:#e53e3e;color:#fff;font-weight:700}
 .wrap{display:grid;grid-template-columns:260px 1fr;gap:10px;padding:10px}
 .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
 h2{font-size:.78rem;color:var(--accent);margin:0 0 8px;letter-spacing:1px}
 .row{display:flex;align-items:center;gap:8px;margin:6px 0}.row label{width:48px;color:var(--mut)}
 input[type=range]{flex:1}
 table{width:100%;border-collapse:collapse;font-size:11.5px}
 th,td{padding:3px 6px;text-align:left;border-bottom:1px solid #1d2530;white-space:nowrap}
 th{color:var(--mut)} .en{color:var(--good)} .dis{color:var(--tx)}
 .bar{display:inline-block;width:70px;height:7px;background:#222c38;border-radius:4px;overflow:hidden;vertical-align:middle}
 .bar>i{display:block;height:100%;background:linear-gradient(90deg,#48bb78,#f6ad55,#f56565)}
 .kpi{color:var(--mut);margin-top:6px}
</style></head><body>
<header><h1>🦾 上位機（連線版）— 接 Python 假硬體 ws://localhost:8765</h1>
 <span id="conn">未連線</span>
 <button id="bEn">使能</button><button id="bMv">移動 L_J4</button>
 <button id="bMode">模式</button><button id="bEs" class="estop">E-STOP</button></header>
<div class="wrap">
 <div class="panel"><h2>左臂關節 Jog (rad)</h2>
  <div class="row"><label>J1</label><input type=range id=j0 min=-1.5 max=1.5 step=.01 value=0></div>
  <div class="row"><label>J2</label><input type=range id=j1 min=-1.5 max=1.5 step=.01 value=0.3></div>
  <div class="row"><label>J4</label><input type=range id=j3 min=-2 max=2 step=.01 value=0.7></div>
  <div class="row"><label>J6</label><input type=range id=j5 min=-1.5 max=1.5 step=.01 value=0.5></div>
  <h2 style="margin-top:12px">OD 讀取</h2>
  <div class="row"><input id=odidx placeholder="0x6077" style="flex:1;background:#0b0f14;color:#e6edf3;border:1px solid #283040;border-radius:5px;padding:4px"><button id=bRd style="width:auto">讀</button></div>
  <div id=odres class="kpi">—</div>
 </div>
 <div class="panel"><h2>各馬達遙測（後端 phu_motor.py 真實數據）</h2>
  <table id=tbl><thead><tr><th>關節</th><th>型號</th><th>SW</th><th>狀態</th>
   <th>實際(cnt)</th><th>力 N·m</th><th>電流 A</th></tr></thead><tbody></tbody></table>
  <div class="kpi" id=kpi>—</div>
 </div></div>
<script>
let ws, last=null;
function connect(){
 ws=new WebSocket("ws://localhost:8765");
 ws.onopen=()=>{document.getElementById('conn').textContent="已連線";document.getElementById('conn').className="ok";};
 ws.onclose=()=>{document.getElementById('conn').textContent="斷線(重試)";document.getElementById('conn').className="";setTimeout(connect,1000);};
 ws.onmessage=e=>{last=JSON.parse(e.data);render();};
}
function send(o){ if(ws&&ws.readyState==1) ws.send(JSON.stringify(o)); }
function render(){
 if(!last)return; const tb=document.querySelector('#tbl tbody');
 tb.innerHTML=last.motors.map(m=>{
  const tqp=Math.min(100,Math.abs(m.torque)/m.peak*100);
  return `<tr><td>${m.name}</td><td style="color:#8b97a6">${m.model}</td>
   <td>${m.sw}</td><td class="${m.state=='OP_ENABLED'?'en':'dis'}">${m.state}</td>
   <td>${m.actual}</td><td>${m.torque.toFixed(2)} <span class="bar"><i style="width:${tqp}%"></i></span></td>
   <td>${m.current.toFixed(2)}</td></tr>`;}).join('');
 document.getElementById('kpi').textContent=
   `CAN1 TX ${last.tx[0]}/RX ${last.rx[0]} · CAN2 TX ${last.tx[1]}/RX ${last.rx[1]} · ${last.estop?'ESTOP':'RUN'}`;
}
document.getElementById('bEn').onclick=()=>send({cmd:'enable'});
document.getElementById('bEs').onclick=()=>send({cmd:'estop'});
document.getElementById('bMv').onclick=()=>send({cmd:'move',joint:3,delta:0.5});
let mode=8;document.getElementById('bMode').onclick=()=>{mode=mode==8?10:8;send({cmd:'mode',value:mode});};
const jm={j0:0,j1:1,j3:3,j5:5};
for(const id in jm)document.getElementById(id).oninput=e=>send({cmd:'jog',joint:jm[id],value:parseFloat(e.target.value)});
document.getElementById('bRd').onclick=()=>{
 const idx=parseInt(document.getElementById('odidx').value||'0x6077');
 send({cmd:'read',node:4,bus:0,index:idx});
 setTimeout(()=>{ if(last){const f=last.frames.find(x=>x.kind=='SDO-rsp');
   document.getElementById('odres').textContent=f?f.decode:'(送出,見監控台)';}},120);
};
connect();
</script></body></html>
